name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

# Permissions minimales par défaut (CWE-829 — principe du moindre privilège)
# Aucun job de ce workflow ne nécessite d'écriture — lecture seule suffit.
permissions:
  contents: read

jobs:
  quality:
    name: Qualité — Lint, Format, Tests, Build, Licences
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Configuration Node.js 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification ESLint (D-SEC-003 — no innerHTML)
        run: npm run lint

      - name: Vérification format Prettier
        run: npm run format:check

      - name: Tests unitaires et intégration (Vitest)
        run: npm run test

      - name: Build de production
        run: npm run build

      - name: Vérification taille du bundle (< 5 Mo)
        run: |
          BUNDLE_SIZE=$(du -sb dist/ | cut -f1)
          MAX_SIZE=$((5 * 1024 * 1024))
          echo "Taille du bundle : ${BUNDLE_SIZE} bytes (max : ${MAX_SIZE} bytes)"
          if [ "$BUNDLE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "ERREUR : Le bundle dépasse 5 Mo (${BUNDLE_SIZE} > ${MAX_SIZE})"
            exit 1
          fi
          echo "OK : Taille bundle dans les limites"

      - name: Vérification compatibilité licences GPL v3
        run: npm run check-licenses

  e2e:
    name: Tests E2E — Playwright avec extension Chrome chargée
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Configuration Node.js 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Build de l'extension (dist/ requis par Playwright)
        run: npm run build

      - name: Installation des binaires Playwright + dépendances système
        run: npx playwright install --with-deps chromium

      - name: Installation xvfb (Chrome headed requis pour charger l'extension MV3)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Exécution des tests E2E (xvfb pour affichage virtuel)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm run test:e2e

      - name: Upload du rapport Playwright HTML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload des traces et captures d'écran en cas d'échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
