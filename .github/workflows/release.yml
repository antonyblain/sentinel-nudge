name: Release

on:
  push:
    tags:
      - 'v*'

# Permissions minimales par défaut (principe du moindre privilège)
# Le job release surcharge localement avec contents: write (nécessaire pour créer la GitHub Release).
permissions:
  contents: read

jobs:
  release:
    name: Build release + SBOM + Publication GitHub Release
    runs-on: ubuntu-latest

    # Surcharge locale : écriture requise pour créer la GitHub Release et uploader les assets
    permissions:
      contents: write  # Nécessaire pour créer la GitHub Release

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Configuration Node.js 24 LTS
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Build de production
        run: npm run build -- --mode production

      - name: Vérification compatibilité licences GPL v3
        run: npm run check-licenses

      - name: Création de l'archive ZIP de l'extension
        run: |
          cd dist
          zip -r ../sentinel-nudge-${{ github.ref_name }}.zip .
          cd ..
          echo "Archive créée : sentinel-nudge-${{ github.ref_name }}.zip"
          ls -lh sentinel-nudge-${{ github.ref_name }}.zip

      - name: Génération du SBOM (SPDX-JSON)
        # Remplace curl | sh Syft — CWE-829 supply-chain fix (T-120)
        # anchore/sbom-action v0.24.0 — SHA immuable du commit pointé par le tag
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: ./dist
          format: spdx-json
          output-file: sentinel-nudge-${{ github.ref_name }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Création de la GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          name: Sentinel Nudge ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            sentinel-nudge-${{ github.ref_name }}.zip
            sentinel-nudge-${{ github.ref_name }}-sbom.spdx.json
          body: |
            ## Sentinel Nudge ${{ github.ref_name }}

            ### Installation manuelle
            1. Télécharger `sentinel-nudge-${{ github.ref_name }}.zip`
            2. Extraire le contenu dans un dossier
            3. Ouvrir Chrome → `chrome://extensions/`
            4. Activer le "Mode développeur"
            5. Cliquer "Charger l'extension non empaquetée" → sélectionner le dossier extrait

            ### SBOM
            Le fichier `sentinel-nudge-${{ github.ref_name }}-sbom.spdx.json` liste toutes
            les dépendances de l'extension avec leurs licences (format SPDX-JSON, anchore/sbom-action).

            > Note : La publication sur le Chrome Web Store est effectuée manuellement
            > par le Commanditaire suite à la review Google (délai 1-7 jours).

      # Publication Chrome Web Store (commentée — nécessite secrets CWS configurés)
      # Référence : DAT §13.3
      #
      # - name: Publication Chrome Web Store
      #   uses: trmcnvn/chrome-addon@v2
      #   with:
      #     extension: ${{ secrets.CWS_EXTENSION_ID }}
      #     zip: sentinel-nudge-${{ github.ref_name }}.zip
      #     client-id: ${{ secrets.CWS_CLIENT_ID }}
      #     client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
      #     refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
